name: Verify sources

# Re-checks every registry entry against Crossref, the GDC Vault and ISBN
# records. Network-bound, so it runs on demand and monthly rather than on push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python tools/verify_sources.py --refresh
